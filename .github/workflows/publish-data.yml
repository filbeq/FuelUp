name: Publish fuel data

on:
  schedule:
    # MIMIT publishes the new files around 06:45 UTC. GitHub starts scheduled
    # runs late (hours, on 2 Oct 2026) or drops them, so run every 2 hours,
    # 07:10-21:10 UTC, off the hour (the scheduler's busiest time). Runs with
    # nothing new stop after the "check" job, in about 20 seconds.
    - cron: "10 7-21/2 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab: always publishes

permissions:
  contents: read

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Does MIMIT have a newer date than the published data? If a source can't be
  # read, the answer is "yes" and the build decides.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.freshness.outputs.needed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: freshness
        working-directory: pipeline
        run: python -m fuel_pipeline.freshness needs-publish

  build:
    needs: check
    # A manual run always publishes (e.g. to republish a fix for the same date).
    if: needs.check.outputs.needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # If tests or the pipeline fail, the following steps and the deploy job
      # are skipped, and the previously published data stays online.
      - name: Run tests
        run: python -m unittest -v

      # Same contract check as CI: the published format must be the one the
      # app's tests were written against.
      - name: Check the Android test fixture matches the pipeline output
        run: python scripts/make_android_fixture.py --check

      - name: Download MIMIT data and build JSON
        run: python -m fuel_pipeline --out out

      # The JSON only lives in this artifact and on GitHub Pages: never in git.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pipeline/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
