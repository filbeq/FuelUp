name: Publish fuel data

# Builds the published data (stations.json, meta.json) with the Kotlin CLI
# (android/cli, same cleaning code as the app) and deploys it to GitHub Pages.
# The last job is the freshness alarm: a failed run (GitHub emails the owner)
# means something we publish is broken. Rules in
# pipeline/fuel_pipeline/freshness.py.
#
# - MIMIT unreachable (it has answered only Italian IPs since 16 Oct 2026):
#   every run is green, with a warning. Phones in Italy download directly.
# - MIMIT reachable but publishing has failed for over a day: only the first
#   run that starts each day builds (one failure email a day, not one per run).
# - Publishing works again after such a gap: a comment on issue #4 says so.

on:
  schedule:
    # MIMIT publishes the new files around 06:45 UTC. GitHub starts scheduled
    # runs hours late (about 5 h in Oct 2026) or drops about half of them, so
    # four tries; 13:10 UTC is after the alarm's 14:00 Italian deadline in
    # summer and winter time. Off the hour (the scheduler's busiest time).
    # Runs with nothing new stop after the "check" job, in about 20 seconds.
    - cron: "10 7 * * *"
    - cron: "40 8 * * *"
    - cron: "10 10 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab: always publishes
    inputs:
      dry_run_published_date:
        description: "Dry run: publish nothing, only run the alarm pretending the published data is from this date (YYYY-MM-DD). Empty = publish."
        required: false
        default: ""

permissions:
  contents: read

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Does MIMIT have a newer date than the published data, and should this run
  # build it?
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # earlier runs of today, for the backoff
    outputs:
      build: ${{ steps.decide.outputs.build }}
      backoff: ${{ steps.decide.outputs.backoff }}
      stale: ${{ steps.freshness.outputs.stale }}
      published: ${{ steps.freshness.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - id: freshness
        working-directory: pipeline
        run: python -m fuel_pipeline.freshness needs-publish

      # Did an earlier scheduled run today already try to build? Only asked
      # when the answer matters (new data, publishing failing for over a day).
      - id: tried
        if: github.event_name == 'schedule' && steps.freshness.outputs.needed == 'true' && steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tried=false
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-data.yml --event schedule \
              --created ">=$(date -u +%F)" --json databaseId --jq ".[].databaseId | select(. != $GITHUB_RUN_ID)"); do
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                --jq '.jobs[] | select(.name == "build" and .conclusion != "skipped") | .name' | grep -q .; then
              echo "run $id already built today"
              tried=true
              break
            fi
          done
          echo "tried=$tried" >> "$GITHUB_OUTPUT"

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run_published_date }}
          NEEDED: ${{ steps.freshness.outputs.needed }}
          TRIED: ${{ steps.tried.outputs.tried }}
        run: |
          build=$NEEDED
          backoff=false
          if [ "$EVENT" = workflow_dispatch ]; then
            # A manual run always publishes (e.g. a fix for the same date),
            # unless it is a dry run of the alarm.
            if [ -n "$DRY_RUN" ]; then build=false; else build=true; fi
          elif [ "$TRIED" = true ]; then
            build=false
            backoff=true
            echo "::notice title=Backoff::Publishing has failed for over a day and an earlier run already tried today: skipping until tomorrow."
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "backoff=$backoff" >> "$GITHUB_OUTPUT"
          echo "build=$build, backoff=$backoff"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # open-source cache on GitHub; no external service

      # If the tests or the CLI fail, the following steps and the deploy job
      # are skipped, and the previously published data stays online.
      # :core's tests include the golden test that rebuilds the app's test
      # fixture: the published format must be the one the app was tested on.
      - name: Test the cleaning code and build the CLI
        run: ./gradlew :core:test :cli:installDist --console=plain

      - name: Download MIMIT data and build JSON
        run: cli/build/install/fuel-data/bin/fuel-data --data-dir "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/out"

      # The JSON only lives in this artifact and on GitHub Pages: never in git.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Fails when the published data is behind MIMIT (see the top of this file).
  # Not after a successful deploy (the data is new by construction, and Pages
  # may still serve the old meta.json for a few minutes), and not in a run the
  # backoff stopped (one failure email a day is enough).
  alarm:
    needs: [check, deploy]
    if: always() && needs.check.result == 'success' && needs.check.outputs.backoff != 'true' && needs.deploy.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare the published data with MIMIT
        env:
          PUBLISHED_DATE: ${{ inputs.dry_run_published_date }}
        run: python -m fuel_pipeline.freshness check ${PUBLISHED_DATE:+--published-date "$PUBLISHED_DATE"}

  # Publishing works again after over a day without new data (e.g. MIMIT
  # unblocked GitHub): a comment on issue #4, so the owner gets a notification.
  resumed:
    needs: [check, deploy]
    if: needs.deploy.result == 'success' && needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.check.outputs.published }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment 4 --repo "$GITHUB_REPOSITORY" --body "Publishing works again: new data published by $RUN_URL. The previous published data was from ${PREVIOUS:-an unreadable meta.json}."
