name: Publish fuel data

on:
  schedule:
    # MIMIT publishes the new files around 06:45 UTC. The afternoon run catches
    # late publications. GitHub may start scheduled runs a few minutes late.
    - cron: "30 7 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # If tests or the pipeline fail, the following steps and the deploy job
      # are skipped, and the previously published data stays online.
      - name: Run tests
        run: python -m unittest -v

      # Same contract check as CI: the published format must be the one the
      # app's tests were written against.
      - name: Check the Android test fixture matches the pipeline output
        run: python scripts/make_android_fixture.py --check

      - name: Download MIMIT data and build JSON
        run: python -m fuel_pipeline --out out

      # The JSON only lives in this artifact and on GitHub Pages: never in git.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pipeline/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
