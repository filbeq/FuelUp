name: CI

# Runs on every push (any branch) and every pull request. Publishing the data
# is a separate workflow (publish-data.yml).
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and app contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pipeline tests
        run: python -m unittest -v

      # The app's unit tests parse a fixture generated by the pipeline. If the
      # pipeline's output changed, the fixture must be regenerated and the app
      # re-tested against it.
      - name: Check the Android test fixture matches the pipeline output
        run: python scripts/make_android_fixture.py --check

  android:
    name: App unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the committed Gradle wrapper (default behaviour).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # open-source cache on GitHub; no external service

      - name: Unit tests and lint
        run: ./gradlew test lint --console=plain

      # Unsigned here (no keystore in CI): checks that R8 (minification and
      # resource shrinking) still succeeds, so a problem shows on every push
      # rather than when a release is tagged.
      - name: Release build
        run: ./gradlew assembleRelease --console=plain
