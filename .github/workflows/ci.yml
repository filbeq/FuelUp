name: CI

# Runs on pushes to main and on pull requests that change code. Docs-only
# changes (any .md file) and other workflow files don't start it: CI can't
# test those (publish and release have manual dry runs). "Run workflow" in the
# Actions tab runs it by hand. Publishing the data is a separate workflow
# (publish-data.yml).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "pipeline/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "android/**"
      - "pipeline/**"
      - ".github/workflows/ci.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Freshness alarm tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only the freshness alarm is Python. The cleaning code and the
      # pipeline/app contract (golden test in :core) are tested by Gradle in
      # the android job.
      - name: Run freshness tests
        run: python -m unittest -v

  android:
    name: App, core and CLI tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the committed Gradle wrapper (default behaviour).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # open-source cache on GitHub; no external service

      - name: Unit tests and lint
        run: ./gradlew test lint --console=plain

      # Unsigned here (no keystore in CI): checks that R8 (minification and
      # resource shrinking) still succeeds, so a problem shows on every push
      # rather than when a release is tagged.
      - name: Release build
        run: ./gradlew assembleRelease --console=plain
